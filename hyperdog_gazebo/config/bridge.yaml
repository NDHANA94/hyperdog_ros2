# ros_gz_bridge: core sensors, ground truth and disturbance (push) interface
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
- ros_topic_name: "/hyperdog/imu"
  gz_topic_name: "hyperdog/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
- ros_topic_name: "/hyperdog/foot_contact/FR"
  gz_topic_name: "hyperdog/foot_contact/FR"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/hyperdog/foot_contact/FL"
  gz_topic_name: "hyperdog/foot_contact/FL"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/hyperdog/foot_contact/BR"
  gz_topic_name: "hyperdog/foot_contact/BR"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/hyperdog/foot_contact/BL"
  gz_topic_name: "hyperdog/foot_contact/BL"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"
  direction: GZ_TO_ROS
- ros_topic_name: "/hyperdog/ground_truth"
  gz_topic_name: "hyperdog/ground_truth"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
- ros_topic_name: "/world/hyperdog/wrench/persistent"
  gz_topic_name: "/world/hyperdog/wrench/persistent"
  ros_type_name: "ros_gz_interfaces/msg/EntityWrench"
  gz_type_name: "gz.msgs.EntityWrench"
  direction: ROS_TO_GZ
- ros_topic_name: "/world/hyperdog/wrench/clear"
  gz_topic_name: "/world/hyperdog/wrench/clear"
  ros_type_name: "ros_gz_interfaces/msg/Entity"
  gz_type_name: "gz.msgs.Entity"
  direction: ROS_TO_GZ
# used by the scenario runner to place the robot (e.g. on its back for self-righting tests)
- service_name: "/world/hyperdog/set_pose"
  ros_type_name: "ros_gz_interfaces/srv/SetEntityPose"
  gz_req_type_name: "gz.msgs.Pose"
  gz_rep_type_name: "gz.msgs.Boolean"
